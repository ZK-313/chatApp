{% extends 'core/base.html' %}

{% block content %}

    <!-- Modern Chat interface -->
    <div class="chat-wrapper">
        <div class="chat-container">
            <div class="chat-header">
                <div class="chat-header-content">
                    <div class="chat-room-info">
                        <h2>💬 Chat Room</h2>
                        <span class="room-name">#general</span>
                    </div>
                    <div class="status-indicator">
                        <span class="status-dot"></span>
                        <span class="status-text">Connected</span>
                    </div>
                </div>
            </div>
            
            <div class="chat-messages" id="chat-log">
                <div class="welcome-message">
                    <p>Welcome to the chat! Start typing to send a message.</p>
                </div>
            </div>
            
            <div class="chat-input-container">
                <div class="input-wrapper">
                    <input 
                        id="chat-message-input" 
                        type="text" 
                        placeholder="Type your message here..." 
                        maxlength="500"
                        autocomplete="off"
                    >
                    <button id="chat-message-submit" class="send-button" aria-label="Send message">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const roomName = "general";

        const chatSocket = new WebSocket(
            'ws://'
            + window.location.host
            + '/ws/chat/'
            + roomName
            + '/'
        );

        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            const username = data.username || 'Anonymous';
            const message = data.message;
            addMessageToChat(username, message);
        };
        
        function addMessageToChat(username, message) {
            const chatLog = document.getElementById('chat-log');
            const currentUser = '{{ user.username|default:"Anonymous" }}';
            const isOwnMessage = username === currentUser;
            
            // Remove welcome message if it exists
            const welcomeMsg = chatLog.querySelector('.welcome-message');
            if (welcomeMsg) {
                welcomeMsg.remove();
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isOwnMessage ? 'own-message' : 'other-message'}`;
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            
            if (!isOwnMessage) {
                const usernameSpan = document.createElement('span');
                usernameSpan.className = 'message-username';
                usernameSpan.textContent = username;
                messageContent.appendChild(usernameSpan);
            }
            
            const messageText = document.createElement('p');
            messageText.className = 'message-text';
            messageText.textContent = message;
            messageContent.appendChild(messageText);
            
            const messageTime = document.createElement('span');
            messageTime.className = 'message-time';
            messageTime.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            messageContent.appendChild(messageTime);
            
            messageDiv.appendChild(messageContent);
            chatLog.appendChild(messageDiv);
            
            // Auto scroll to bottom
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        document.querySelector('#chat-message-input').focus();
        
        function sendMessage() {
            const messageInputDom = document.querySelector('#chat-message-input');
            const message = messageInputDom.value.trim();
            
            if (message === '') {
                return;
            }
            
            chatSocket.send(JSON.stringify({
                'message': message
            }));
            messageInputDom.value = '';
            messageInputDom.focus();
        }
        
        document.querySelector('#chat-message-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        document.querySelector('#chat-message-submit').addEventListener('click', function(e) {
            e.preventDefault();
            sendMessage();
        });
        
        // Update status indicator on connection
        chatSocket.onopen = function() {
            const statusDot = document.querySelector('.status-dot');
            const statusText = document.querySelector('.status-text');
            if (statusDot && statusText) {
                statusDot.style.background = '#4ade80';
                statusText.textContent = 'Connected';
            }
        };
        
        chatSocket.onclose = function() {
            const statusDot = document.querySelector('.status-dot');
            const statusText = document.querySelector('.status-text');
            if (statusDot && statusText) {
                statusDot.style.background = '#ef4444';
                statusText.textContent = 'Disconnected';
            }
        };
    </script>

    {% endblock %}
